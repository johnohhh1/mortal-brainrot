'use strict';
/* ============================================================
   MORTAL BRAINROT — single-file fighting game
   Engine: fixed-timestep 60Hz, frame-data driven, state machine,
   hitbox/hurtbox separation, input ring buffer + motion parser.
   Toggle DEBUG with ` (backquote). Escape pauses. M mutes music.
   ============================================================ */

// ---------- constants ----------
const W=1280, H=720;
const WORLD_W=2000, GROUND_Y=620, WALL=80;
const TICK_MS=1000/60;
const ROUNDS_TO_WIN=2, ROUND_SECS=99;
let DEBUG=false, PAUSED=false, MUTE=false;
let tickCount=0;            // global logic tick (always increments, even in hitstop, for input timestamps)

// ---------- utils ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);          // cosmetic only
const now=()=> (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
// seeded RNG for gameplay randomness (item drops) — deterministic per match
const RNG={s:1234567};
function grand(){ RNG.s=(RNG.s*1103515245+12345)>>>0; return (RNG.s>>>8)/16777216; }

// ---------- audio ----------
const A={ctx:null, master:null, ok:false,
  init(){ if(this.ok)return; try{
    const AC=(typeof AudioContext!=='undefined')?AudioContext:(typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
    if(!AC)return;
    this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=0.5;
    this.master.connect(this.ctx.destination); this.ok=true;
  }catch(e){} },
  t(){ return this.ctx.currentTime; }
};
function tone(freq,dur,type,vol,glideTo,t0){
  if(!A.ok||MUTE&&type==='music')return;
  const c=A.ctx, t=t0!==undefined?t0:A.t();
  const o=c.createOscillator(), g=c.createGain();
  o.type=type==='music'?'square':(type||'sine'); o.frequency.setValueAtTime(freq,t);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,fc,t0){
  if(!A.ok)return;
  const c=A.ctx, t=t0!==undefined?t0:A.t();
  const len=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc||1800;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(A.master); src.start(t);
}
const SFX={
  hit(p){ noiseBurst(0.09+p*0.02,0.35,900); tone(160,0.12,'sine',0.3,55); },
  counter(){ noiseBurst(0.14,0.4,1400); tone(300,0.18,'sawtooth',0.25,80); },
  block(){ noiseBurst(0.04,0.2,3000); tone(700,0.05,'triangle',0.12,500); },
  whoosh(){ noiseBurst(0.12,0.10,700); },
  launch(){ tone(150,0.25,'sawtooth',0.2,600); noiseBurst(0.1,0.25,1200); },
  ko(){ noiseBurst(0.5,0.5,500); tone(90,0.6,'sawtooth',0.35,30); },
  coin(){ tone(900,0.07,'square',0.12); tone(1350,0.14,'square',0.12,undefined,A.ok?A.t()+0.07:0); },
  dash(){ noiseBurst(0.07,0.12,2500); },
  proj(){ tone(500,0.08,'square',0.1,900); },
  freeze(){ tone(1200,0.3,'sine',0.12,300); noiseBurst(0.25,0.1,4000); },
  super(){ noiseBurst(0.4,0.4,600); tone(60,0.7,'sawtooth',0.4,120); tone(120,0.7,'sawtooth',0.25,240); },
  confetti(){ if(!A.ok)return; for(let i=0;i<7;i++)tone(600+i*180,0.1,'triangle',0.07,undefined,A.t()+i*0.05); },
  stagger(){ tone(400,0.5,'sine',0.1,80); }
};
// synthesized announcer: gravelly gibberish sized to the word
function say(text){
  if(!A.ok)return;
  const syl=Math.max(1,(text.match(/[aeiouy]+/gi)||['a']).length);
  let t=A.t()+0.02;
  for(let i=0;i<Math.min(syl,6);i++){
    const c=A.ctx, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
    o.type='sawtooth'; const base=95+Math.random()*45;
    o.frequency.setValueAtTime(base*1.3,t); o.frequency.exponentialRampToValueAtTime(base*0.75,t+0.13);
    f.type='lowpass'; f.frequency.value=520; f.Q.value=6;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(f); f.connect(g); g.connect(A.master); o.start(t); o.stop(t+0.17);
    noiseBurst(0.03,0.15,2500,t);
    t+=0.135;
  }
}
// tiny music loop, driven from the tick so it pauses with the game
const MUSIC={step:0, bass:[55,55,82.4,55,65.4,65.4,49,61.7],
  update(){ if(!A.ok||MUTE)return;
    if(tickCount%15===0){
      const s=this.step++;
      if(s%2===0)noiseBurst(0.02,0.05,6000);                       // hat
      if(s%4===0){ noiseBurst(0.09,0.12,300); tone(70,0.1,'sine',0.15,40); } // kick
      if(s%4===2)tone(this.bass[(s>>2)%8]*2,0.12,'music',0.05,undefined);
      tone(this.bass[(s>>2)%8],0.22,'music',0.06);
    }
  }
};

// ---------- input ----------
const KEY={down:new Set(), pendDown:new Set(), pendUp:new Set(), pressed:new Set(), released:new Set()};
function handleKey(code,isDown){
  if(isDown){ if(!KEY.down.has(code)){KEY.down.add(code); KEY.pendDown.add(code);} }
  else { KEY.down.delete(code); KEY.pendUp.add(code); }
}
if(typeof window!=='undefined'&&window.addEventListener){
  const PREVENT=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
  window.addEventListener('keydown',e=>{ A.init(); if(!e.repeat)handleKey(e.code,true); if(PREVENT.has(e.code))e.preventDefault(); });
  window.addEventListener('keyup',e=>{ handleKey(e.code,false); if(PREVENT.has(e.code))e.preventDefault(); });
  window.addEventListener('blur',()=>{ KEY.down.clear(); });
}
function latchKeys(){
  KEY.pressed=new Set(KEY.pendDown); KEY.pendDown.clear();
  KEY.released=new Set(KEY.pendUp); KEY.pendUp.clear();
  if(KEY.pressed.has('Backquote'))DEBUG=!DEBUG;
  if(KEY.pressed.has('KeyM'))MUTE=!MUTE;
}
const P1KEYS={left:['KeyA','GP0Left'],right:['KeyD','GP0Right'],up:['KeyW','GP0Up'],down:['KeyS','GP0Down'],
              L:['KeyF','GP0L'],H:['KeyG','GP0H'],B:['KeyH','GP0B']};
const P2KEYS={left:['ArrowLeft','GP1Left'],right:['ArrowRight','GP1Right'],up:['ArrowUp','GP1Up'],down:['ArrowDown','GP1Down'],
              L:['Numpad1','Comma','GP1L'],H:['Numpad2','Period','GP1H'],B:['Numpad3','Slash','GP1B']};
// 1-player mode: the human gets BOTH control sets and ANY gamepad
const SOLO_KEYS={left:['KeyA','ArrowLeft','GP0Left','GP1Left'],right:['KeyD','ArrowRight','GP0Right','GP1Right'],
              up:['KeyW','ArrowUp','GP0Up','GP1Up'],down:['KeyS','ArrowDown','GP0Down','GP1Down'],
              L:['KeyF','Numpad1','Comma','GP0L','GP1L'],H:['KeyG','Numpad2','Period','GP0H','GP1H'],
              B:['KeyH','Numpad3','Slash','GP0B','GP1B']};

// ---------- gamepads → virtual key codes ----------
// Each connected pad synthesizes GP{i}* codes through the same edge-latched
// key pipeline as the keyboard, so motions, dashes and menus need no special code.
const GP={count:0};
function gpSet(code,want){
  const has=KEY.down.has(code);
  if(want&&!has)handleKey(code,true);
  else if(!want&&has)handleKey(code,false);
}
function pollGamepads(){
  if(typeof navigator==='undefined'||!navigator.getGamepads)return;
  let pads; try{ pads=navigator.getGamepads(); }catch(e){ return; }
  if(!pads)return;
  GP.count=0;
  for(let i=0;i<2;i++){
    const g=pads[i], pre='GP'+i;
    if(!g||!g.buttons){ for(const s of ['Left','Right','Up','Down','L','H','B','Start'])gpSet(pre+s,false); continue; }
    GP.count++;
    const on=n=>{ const b=g.buttons[n]; return !!b&&(b.pressed||b.value>0.5); };
    const ax=(g.axes&&g.axes.length>1)?g.axes:[0,0];
    gpSet(pre+'Left', on(14)||ax[0]<-0.4);
    gpSet(pre+'Right',on(15)||ax[0]>0.4);
    gpSet(pre+'Up',   on(12)||ax[1]<-0.5);
    gpSet(pre+'Down', on(13)||ax[1]>0.5);
    gpSet(pre+'L', on(0)||on(2));           // A / X  (Cross / Square)
    gpSet(pre+'H', on(1)||on(3));           // B / Y  (Circle / Triangle)
    gpSet(pre+'B', on(4)||on(5)||on(6)||on(7)); // any shoulder or trigger
    gpSet(pre+'Start', on(9)||on(8));
  }
}
// which cardinal directions a diagonal "contains" for motion matching
const DIRCONT={1:[1,2,4],2:[2],3:[3,2,6],4:[4],5:[5],6:[6],7:[7,4,8],8:[8],9:[9,6,8]};
const dirMatch=(d,want)=>DIRCONT[d].includes(want);

class Pad{
  constructor(map){ this.map=map; this.hist=[{d:5,t:-99}]; this.lastDir=5;
    this.pressT={L:-99,H:-99,B:-99}; this.relT={L:-99,H:-99,B:-99};
    this.dir=5; this.dashEvent=0; /* +1 fwd, -1 back, set for one tick */ }
  anyDown(list){ for(const k of list)if(KEY.down.has(k))return true; return false; }
  anyPress(list){ for(const k of list)if(KEY.pressed.has(k))return true; return false; }
  anyRel(list){ for(const k of list)if(KEY.released.has(k))return true; return false; }
  held(n){ return this.anyDown(this.map[n]); }
  poll(facing){
    let h=0,v=0;
    if(this.held('left'))h-=1; if(this.held('right'))h+=1;
    if(this.held('up'))v+=1; if(this.held('down'))v-=1;
    const fwd=h*facing; // facing-relative
    let d=5;
    if(v>0)d=fwd>0?9:(fwd<0?7:8);
    else if(v<0)d=fwd>0?3:(fwd<0?1:2);
    else d=fwd>0?6:(fwd<0?4:5);
    this.dir=d;
    this.dashEvent=0;
    if(d!==this.lastDir){
      // detect double-tap dash on the transition into pure 6 or 4
      if(d===6&&this.tapped(6))this.dashEvent=1;
      if(d===4&&this.tapped(4))this.dashEvent=-1;
      this.hist.push({d,t:tickCount});
      if(this.hist.length>48)this.hist.shift();
      this.lastDir=d;
    }
    for(const b of ['L','H','B']){
      if(this.anyPress(this.map[b]))this.pressT[b]=tickCount;
      if(this.anyRel(this.map[b]))this.relT[b]=tickCount;
    }
  }
  tapped(want){ // previous entries: a `want` then something else, recently
    const hs=this.hist; let seenNeutral=false;
    for(let i=hs.length-1;i>=0;i--){
      const e=hs[i]; if(tickCount-e.t>13)break;
      if(!dirMatch(e.d,want)&&!seenNeutral){ seenNeutral=true; continue; }
      if(seenNeutral&&e.d===want)return true;
    }
    return false;
  }
  pressedNow(b){ return this.pressT[b]===tickCount; }
  releasedNow(b){ return this.relT[b]===tickCount; }
  pressedWithin(b,n){ return tickCount-this.pressT[b]<=n; }
  matchMotion(motion,windowT){
    // motion e.g. '236' — scan history backwards, dirs must appear in order.
    // pure double-taps ('22','44','66') match strictly so diagonals can't fake them
    const strict=motion.length===2&&motion[0]===motion[1];
    const ok=(d,w)=>strict?d===w:dirMatch(d,w);
    let need=motion.length-1;
    const limit=tickCount-windowT;
    for(let i=this.hist.length-1;i>=0&&need>=0;i--){
      const e=this.hist[i]; if(e.t<limit)break;
      if(ok(e.d,+motion[need]))need--;
    }
    return need<0;
  }
}

// ---------- FX ----------
const PARTS=[];
function addSpark(x,y,color,n,pow){
  for(let i=0;i<n;i++){ const a=rand(0,TAU), s=rand(1,pow);
    PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rand(10,26),max:26,color,sz:rand(2,5),kind:'spark'}); }
}
function addConfetti(x,y,n){
  const cols=['#ff5d8f','#ffd166','#06d6a0','#4cc9f0','#c77dff','#ff9e00'];
  for(let i=0;i<n;i++)PARTS.push({x:x+rand(-30,30),y:y+rand(-30,30),vx:rand(-4,4),vy:rand(-9,-2),
    life:rand(50,110),max:110,color:cols[(Math.random()*cols.length)|0],sz:rand(3,7),rot:rand(0,TAU),vr:rand(-0.3,0.3),kind:'confetti'});
}
function addDust(x,y,n){ for(let i=0;i<n;i++)PARTS.push({x:x+rand(-14,14),y,vx:rand(-2,2),vy:rand(-2,-0.3),life:rand(12,24),max:24,color:'#b9a6d8',sz:rand(3,6),kind:'dust'}); }
function updateParts(){
  for(let i=PARTS.length-1;i>=0;i--){ const p=PARTS[i];
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if(p.kind==='confetti'){ p.vy+=0.12; p.vx*=0.99; p.rot+=p.vr; if(p.y>GROUND_Y+6){p.y=GROUND_Y+6;p.vy=0;p.vx*=0.8;} }
    else p.vy+=0.15;
    if(p.life<=0)PARTS.splice(i,1);
  }
}

function hitRectWorld(f,h){
  const cx=f.x+h.fx*f.facing, cy=f.y-h.fy;
  return {x:cx-h.w/2,y:cy-h.h/2,w:h.w,h:h.h};
}
function hurtboxFor(f){
  let ww=f.def.w, hh=f.def.h;
  if(f.state==='crouch'||(f.state==='attack'&&f.move&&f.move.crouch))hh*=0.68;
  if(f.airborne())hh*=0.8;
  const yTop=f.airborne()?f.y-hh:f.y-hh;
  return {x:f.x-ww/2,y:yTop,w:ww,h:hh};
}

class Fighter{
  constructor(defId,slot,pad,palIdx){
    this.defId=defId; this.def=CHARS[defId]; this.slot=slot; this.pad=pad; this.palIdx=palIdx||0;
    this.x=WORLD_W/2+(slot===0?-220:220); this.y=GROUND_Y; this.px=this.x; this.py=this.y;
    this.vx=0; this.vy=0; this.facing=slot===0?1:-1;
    this.hpMax=this.def.hp; this.hp=this.hpMax; this.recov=0; this.meter=0;
    this.state='idle'; this.st=0; this.move=null; this.cls='';
    this.hitConfirmed=false; this.hitDone=new Set(); this.atkInstance=0;
    this.buf=null; this.dashBuf=0; this.dashBufT=-99;
    this.stunT=0; this.blockLow=false; this.jumpVx=0; this.landLag=5;
    this.comboTaken=0; this.juggleN=0; this.gravScale=1;
    this.installT=0; this.installSpeed=1; this.installTrickle=false;
    this.slowT=0; this.lastHurtT=-999; this.staggerT=0;
    this.grabVictim=null; this.grabbedBy=null; this.hidden=false;
    this.squashT=0; this.dispHp=this.hpMax; this.armorFlash=0; this.runJump=false;
    this.cine=null; this.koBounced=false; this.koVy=0;
  }
  airborne(){ return this.y<GROUND_Y-0.5; }
  speedMult(){ return (this.installT>0?this.installSpeed:1)*(this.slowT>0?0.62:1); }
  invuln(){
    return this.state==='wakeup'||(this.state==='backdash'&&this.st<=8)
      ||this.state==='knockdown'||this.state==='ko'||this.state==='grabbed'
      ||this.state==='locked'||this.hidden;
  }
  faceOpp(o){ if(!this.airborne())this.facing=o.x>=this.x?1:-1; }
  setState(n){
    this.state=n; this.st=0;
    if(n==='idle'||n==='walk'||n==='crouch'||n==='block'||n==='dash'||n==='backdash'||n==='run'||n==='runstop'||n==='air'||n==='wakeup'){
      this.comboTaken=0; this.juggleN=0; this.gravScale=1;
    }
    if(n!=='attack')this.move=null;
    if(n==='land'||n==='knockdown'){ this.squashT=8; addDust(this.x,GROUND_Y,n==='land'?4:8); }
  }
  endAttack(){
    if(this.grabVictim){ this.grabVictim=null; }
    if(this.airborne())this.setState('air');
    else if(this.pad.held('down'))this.setState('crouch');
    else this.setState('idle');
  }
  update(o){
    this.st++;
    if(this.slowT>0)this.slowT--;
    if(this.installT>0){ this.installT--; if(this.installTrickle)this.meter=Math.min(100,this.meter+0.06); }
    if(this.squashT>0)this.squashT--;
    if(this.armorFlash>0)this.armorFlash--;
    // recoverable health regen
    if(this.recov>0&&tickCount-this.lastHurtT>90&&this.hp>0){
      const r=Math.min(0.35,this.recov); this.hp=Math.min(this.hpMax,this.hp+r); this.recov-=r;
    }
    STATES[this.state].update(this,o);
    // integrate + walls + ground
    if(this.state!=='grabbed'&&this.state!=='locked'){
      this.x+=this.vx; this.y+=this.vy;
      this.x=clamp(this.x,WALL,WORLD_W-WALL);
      if(this.y>=GROUND_Y&&this.vy>0){ this.y=GROUND_Y; this.vy=0; onLand(this); }
    }
  }
  cornered(){ return this.x<=WALL+2||this.x>=WORLD_W-WALL-2; }
}

function onLand(f){
  if(f.state==='air')f.setState('land');
  else if(f.state==='attack'){ f.setState('land'); f.landLag=8; }
  else if(f.state==='juggle'){ f.vx*=0.4; f.setState('knockdown'); addShake(4,0,1); SFX.hit(1); }
  else if(f.state==='ko'){
    if(Math.abs(f.vy)>0){} // vy already zeroed
    if(!f.koBounced&&f.koVy>5){ f.koBounced=true; f.vy=-f.koVy*0.35; f.y=GROUND_Y-1; addDust(f.x,GROUND_Y,10); addShake(5,0,1); }
    else f.vx*=0.6;
  }
}

// ---------- command detection ----------
function detectCommand(f){
  const p=f.pad, m=f.def.moves;
  const pL=p.pressedNow('L'), pH=p.pressedNow('H');
  const rL=p.releasedNow('L'), rH=p.releasedNow('H');
  const forSp=b=> b==='L'?(pL||rL):(b==='H'?(pH||rH):(pL||pH||rL||rH));
  const exPressed=(pL&&p.pressedWithin('H',2))||(pH&&p.pressedWithin('L',2));
  const air=f.airborne();
  if(!air){
    if(m.super&&forSp(m.super.input.btn)&&f.meter>=m.super.cost&&p.matchMotion(m.super.input.motion,34))
      return {move:m.super,cls:'super',cost:m.super.cost};
    for(const key of ['sp1','sp2']){
      const mv=m[key]; if(!mv)continue;
      if(forSp(mv.input.btn)&&p.matchMotion(mv.input.motion,18)){
        if(exPressed&&mv.ex&&f.meter>=mv.ex.cost)return {move:mv.ex,cls:'sp',cost:mv.ex.cost};
        return {move:mv,cls:'sp',cost:0};
      }
    }
  }
  if(!(pL||pH))return null;
  if(air)return pH?{move:m.jH,cls:'H',cost:0}:{move:m.jL,cls:'L',cost:0};
  const down=p.held('down');
  if(pH)return {move:down?m.cH:m.H,cls:'H',cost:0};
  return {move:down?m.cL:m.L,cls:'L',cost:0};
}
function payAndStart(f,c){
  if(c.cost>0){ if(f.meter<c.cost)return false; f.meter-=c.cost; }
  startAttack(f,c.move,c.cls); f.buf=null; return true;
}
function startAttack(f,move,cls){
  f.move=move; f.cls=cls; f.hitConfirmed=false; f.hitDone=new Set(); f.atkInstance++;
  f.vx=0; f.setStateAttack();
  SFX.whoosh();
  if(move.superFlash){
    FXS.superfx=50; FXS.hitstop=Math.max(FXS.hitstop,24); FXS.flash=10;
    showBanner(move.name,80,f.def.name,'#ffd166'); say(move.name); SFX.super();
  }
}
Fighter.prototype.setStateAttack=function(){ this.state='attack'; this.st=0; };

function tryBuffered(f){
  if(f.buf){
    const c=f.buf.cmd;
    if(payAndStart(f,c))return true;
    f.buf=null;
  }
  return false;
}

// ---------- states ----------
function ground(f,o){
  f.faceOpp(o);
  f.vx=0; f.vy=0;
  const p=f.pad;
  if(tryBuffered(f))return;
  if(p.held('B')){ f.setState('block'); return; }
  if(f.dashBuf){ const d=f.dashBuf; f.dashBuf=0; f.setState(d>0?'dash':'backdash'); SFX.dash(); return; }
  if(p.dir>=7){ f.jumpVx=p.dir===9?1:(p.dir===7?-1:0); f.runJump=false; f.setState('jumpsquat'); return; }
  if(p.dir<=3&&p.dir>=1){ if(f.state!=='crouch')f.setState('crouch'); return; }
  if(p.dir===6){ f.vx=f.def.walk*f.speedMult()*f.facing; if(f.state!=='walk')f.setState('walk'); }
  else if(p.dir===4){ f.vx=-f.def.back*f.speedMult()*f.facing; if(f.state!=='walk')f.setState('walk'); }
  else if(f.state!=='idle')f.setState('idle');
}
const STATES={
  idle:{update:ground},
  walk:{update:ground},
  crouch:{update:ground},
  block:{update(f,o){
    f.faceOpp(o); f.vx=0; f.blockLow=f.pad.held('down');
    if(!f.pad.held('B')){ ground(f,o); }
  }},
  blockstun:{update(f){ f.vx*=0.82; if(--f.stunT<=0)f.setState(f.pad.held('B')?'block':'idle'); }},
  jumpsquat:{update(f){
    f.vx=0;
    if(f.st>=3){
      f.vy=f.def.jumpVy*(f.slowT>0?0.9:1);
      if(f.runJump){ // running jump: full run momentum carries into the arc (MK3-style)
        f.vx=f.facing*f.jumpVx*f.def.run*1.15*f.speedMult();
        f.runJump=false;
      }else{
        f.vx=f.jumpVx*f.def.walk*1.35*f.speedMult()*f.facing*(f.jumpVx!==0?1:0);
      }
      // jumpVx sign is facing-relative: +1 = toward opponent
      f.setState('air');
    }
  }},
  air:{update(f){
    f.vy+=f.def.grav;
    if(tryBuffered(f))return;
  }},
  land:{update(f){ f.vx=0; if(f.st>=f.landLag){ f.landLag=5; f.setState('idle'); } }},
  dash:{update(f,o){
    const sp=f.def.dash*f.speedMult();
    f.vx=f.facing*(f.st<9?sp:sp*0.5);
    if(f.installT>0&&f.st%3===0)addDust(f.x-f.facing*20,f.y-40,1);
    if(tryBuffered(f))return;
    if(f.st>=8&&f.pad.dir===6){ f.setState('run'); return; } // keep holding forward out of a dash = RUN
    if(f.st>=14)f.setState('idle');
  }},
  backdash:{update(f){ f.vx=-f.facing*f.def.bdash; if(f.st>=12)f.setState('idle'); }},
  // RUN — sustained sprint (dash into held forward). Attack, jump, crouch or block
  // straight out of it; releasing forward skids to a stop. No auto-facing mid-run.
  run:{update(f,o){
    f.vx=f.facing*f.def.run*f.speedMult();
    if(f.st%4===0)addDust(f.x-f.facing*26,GROUND_Y,1);
    if(tryBuffered(f))return;
    const p=f.pad;
    if(p.held('B')){ f.setState('block'); return; }
    if(p.dir>=7){ f.jumpVx=p.dir===7?-1:1; f.runJump=true; f.setState('jumpsquat'); return; }
    if(p.dir>=1&&p.dir<=3){ f.setState('crouch'); return; }
    if(p.dir!==6)f.setState('runstop');
  }},
  runstop:{update(f){ f.vx*=0.75; if(f.st>=5)f.setState('idle'); }},
  attack:{update(f,o){
    const m=f.move, t=f.st;
    if(!m){ f.setState('idle'); return; }
    let moved=false;
    if(m.vel)for(const v of m.vel)if(t>=v.s&&t<=v.e){ f.vx=v.vx*f.facing*(f.slowT>0?0.7:1); if(v.vy)f.vy=v.vy; moved=true; }
    if(f.airborne()){ f.vy+=f.def.grav; }
    else if(!moved)f.vx*=0.7;
    if(m.spawn)for(const s of m.spawn)if(s.f===t)doSpawn(f,s);
    if(m.install&&t===8){ f.installT=m.install.dur; f.installSpeed=m.install.speed; f.installTrickle=!!m.install.trickle; SFX.coin(); addSpark(f.x,f.y-80,'#ffd166',14,5); }
    // command grab
    if(m.grab){
      const g=m.grab;
      if(!f.grabVictim&&t>=g.s&&t<=g.e){
        const dx=(o.x-f.x)*f.facing;
        const grabbable=!o.airborne()&&!o.invuln()
          &&!['hitstun','juggle','blockstun','stagger'].includes(o.state);
        if(grabbable&&dx>0&&dx<g.range+(f.def.w+o.def.w)/2&&Math.abs(o.y-f.y)<30){
          f.grabVictim=o; o.grabbedBy=f; o.setState('grabbed');
          FXS.hitstop=Math.max(FXS.hitstop,8); SFX.hit(2); addSpark(o.x,o.y-80,'#ffd166',12,5);
        }
      }
      if(f.grabVictim){
        const v=f.grabVictim;
        v.x=f.x+f.facing*58; v.y=f.y;
        if(t===g.release){
          v.comboTaken=1; v.lastHurtT=tickCount; v.recov=0;
          dealDamage(v,g.dmg,false);
          addSpark(v.x,v.y-80,'#ff5d8f',22,8); addShake(9,f.facing,-1); SFX.hit(4);
          FXS.hitstop=Math.max(FXS.hitstop,10);
          if(v.hp<=0&&GAME.phase==='active'){ f.grabVictim=null; koCheck(f,v,f.facing); }
          else{ v.setState('juggle'); v.juggleN=1; v.gravScale=1;
            v.vy=g.kb.y; v.vx=g.kb.x*f.facing*v.def.weight; f.grabVictim=null; }
        }
      }
    }
    // cancels: buffered moves, dash-cancel, jump-cancel
    if(m.cancel&&t>=m.cancel.win[0]&&t<=m.cancel.win[1]&&(!m.cancel.onHit||f.hitConfirmed)){
      if(f.buf&&m.cancel.types.includes(f.buf.cmd.cls)){
        if(payAndStart(f,f.buf.cmd))return;
      }
      if(f.dashBuf&&m.cancel.types.includes('dash')&&f.hitConfirmed){
        const d=f.dashBuf; f.dashBuf=0; f.setState(d>0?'dash':'backdash'); SFX.dash(); return;
      }
      if(m.cancel.types.includes('jump')&&f.hitConfirmed&&f.pad.dir>=7&&!f.airborne()){
        f.jumpVx=f.pad.dir===9?1:(f.pad.dir===7?-1:0); f.runJump=false; f.setState('jumpsquat'); return;
      }
    }
    if(t>=m.total)f.endAttack();
  }},
  hitstun:{update(f){ f.vx*=0.85; if(--f.stunT<=0)f.setState('idle'); }},
  juggle:{update(f){ f.vy+=f.def.grav*f.gravScale; f.vx*=0.995; }},
  knockdown:{update(f){ f.vx*=0.8; if(f.st>=45)f.setState('wakeup'); }},
  wakeup:{update(f){ f.vx=0; if(f.st>=25)f.setState('idle'); }},
  grabbed:{update(f){ if(!f.grabbedBy||f.grabbedBy.state!=='attack'||f.grabbedBy.grabVictim!==f){ f.grabbedBy=null; f.setState('idle'); } }},
  stagger:{update(f){ f.vx=0; if(--f.staggerT<=0)GAME.staggerExpired(f); }},
  ko:{update(f){ if(f.airborne()){ f.vy+=f.def.grav*0.8; f.koVy=f.vy; } else f.vx*=0.85; }},
  win:{update(f){ f.vx=0; }},
  locked:{update(f){ f.vx=0; }},
};

// ---------- damage / hits ----------
function dealDamage(d,amt,recoverable){
  d.hp-=amt;
  if(recoverable){ d.recov+=amt*0.85; if(d.hp<1)d.hp=1; } // chip can't KO
  if(d.hp<0)d.hp=0;
}
function guardAllows(guard,low){
  if(guard==='mid')return true;
  if(guard==='low')return low;
  if(guard==='high')return !low;
  return false;
}
function koCheck(a,d,dir){
  d.hp=0;
  if(GAME.phase!=='active'&&GAME.phase!=='finish')return;
  const matchPoint=GAME.wins[a.slot]===ROUNDS_TO_WIN-1;
  if(matchPoint&&GAME.phase==='active')GAME.beginFinish(a,d);
  else GAME.beginKO(a,d,dir,true);
}
function applyHitEvent(a,d,h,dir,isProj){
  if(d.invuln()||d.hp<=0&&GAME.phase!=='finish')return;
  // armor absorb
  if(d.state==='attack'&&d.move&&d.move.armor&&d.st>=d.move.armor.s&&d.st<=d.move.armor.e&&h.guard!=='grab'){
    dealDamage(d,h.dmg*0.4,false); d.armorFlash=10; d.lastHurtT=tickCount;
    addSpark(d.x,d.y-90,'#ffffff',10,4); SFX.block(); FXS.hitstop=Math.max(FXS.hitstop,4);
    if(!isProj)a.hitConfirmed=true;
    if(d.hp<=0)koCheck(a,d,dir);
    return;
  }
  const blocking=(d.state==='block'||d.state==='blockstun');
  if(blocking&&guardAllows(h.guard,d.blockLow)){
    if(h.chip)dealDamage(d,h.chip,true);
    d.lastHurtT=tickCount;
    d.stunT=h.bs; d.setState('blockstun');
    d.vx=dir*h.kb.x*0.75;
    if(d.cornered()&&!isProj)a.vx=-dir*h.kb.x*0.6;
    a.meter=Math.min(100,a.meter+2); d.meter=Math.min(100,d.meter+1.5);
    const pt=hitPoint(d,h,dir);
    addSpark(pt.x,pt.y,'#57c7ff',7,3.5); SFX.block();
    FXS.hitstop=Math.max(FXS.hitstop,3); addShake(2,dir,0);
    if(!isProj)a.hitConfirmed=true;
    return;
  }
  // clean hit
  const counter=d.state==='attack'&&d.move&&d.move.hits&&d.st<=lastActive(d.move);
  const staggerKill=GAME.phase==='finish'&&d===GAME.finVictim;
  let dmg=h.dmg*dmgScale(d.comboTaken)*(counter?1.25:1);
  if(!staggerKill)dealDamage(d,dmg,false);
  d.recov=0; d.lastHurtT=tickCount;
  d.comboTaken++;
  GAME.combo[a.slot]={n:d.comboTaken,t:70};
  a.meter=Math.min(100,a.meter+h.dmg*0.28); d.meter=Math.min(100,d.meter+h.dmg*0.16);
  if(!isProj)a.hitConfirmed=true;
  if(h.slow){ d.slowT=Math.max(d.slowT,h.slow); SFX.freeze(); }
  const pt=hitPoint(d,h,dir);
  const big=dmg>=60;
  addSpark(pt.x,pt.y,counter?'#ff3860':(big?'#ff9e00':'#ffd166'),counter?18:(big?16:10),big?7:4.5);
  if(counter){ showBanner('COUNTER!',34,'','#ff3860'); SFX.counter(); }
  else SFX.hit(big?3:1);
  FXS.hitstop=Math.max(FXS.hitstop,Math.round(clamp(4+dmg*0.07,4,12)));
  addShake(clamp(2.5+dmg*0.08,2.5,11),dir,-0.4);
  if(staggerKill){ GAME.beginKO(a,d,dir,true); return; }
  if(d.hp<=0){ koCheck(a,d,dir); return; }
  const airb=d.airborne();
  if(h.launcher||airb||h.knockdown){
    d.setState('juggle'); d.juggleN++;
    d.gravScale=1+0.18*d.juggleN;
    let vy=h.kb.y!==0?h.kb.y:(h.launcher?-10:-5);
    if(airb&&!h.launcher)vy=Math.min(vy,-4)*0.85;
    d.vy=vy; d.y=Math.min(d.y,GROUND_Y-1);
    d.vx=dir*h.kb.x*d.def.weight*0.9;
    if(h.launcher&&!airb)SFX.launch();
  }else{
    d.stunT=h.hs+(counter?8:0);
    d.setState('hitstun');
    d.vx=dir*h.kb.x*d.def.weight*0.9;
    if(d.cornered()&&!isProj)a.vx=-dir*h.kb.x*0.55;
  }
}
function hitPoint(d,h,dir){
  return {x:d.x+dir* -10, y:d.y-(h.fy||80)+rand(-10,10)};
}
function resolveCombat(){
  const evs=[];
  const [f1,f2]=GAME.f;
  for(const [a,d] of [[f1,f2],[f2,f1]]){
    if(a.state!=='attack'||!a.move||!a.move.hits)continue;
    const hb=hurtboxFor(d);
    a.move.hits.forEach((h,i)=>{
      if(a.st<h.s||a.st>h.e||a.hitDone.has(i))return;
      if(rectsOverlap(hitRectWorld(a,h),hb)){
        a.hitDone.add(i);
        evs.push({a,d,h,dir:a.facing,isProj:false});
      }
    });
  }
  // projectiles vs fighters
  for(const p of PROJS){
    if(p.dead||p.delay>0)continue;
    for(const d of GAME.f){
      if(d===p.owner||p.hitUsed)continue;
      if(rectsOverlap(p.rect(),hurtboxFor(d))&&!d.invuln()){
        p.hitUsed=true; p.dead=true; p.splat();
        const dir=p.vx!==0?Math.sign(p.vx):(d.x>=p.owner.x?1:-1);
        evs.push({a:p.owner,d,h:p.spec,dir,isProj:true});
      }
    }
  }
  // projectile clash
  for(let i=0;i<PROJS.length;i++)for(let j=i+1;j<PROJS.length;j++){
    const p=PROJS[i],q=PROJS[j];
    if(p.dead||q.dead||p.owner===q.owner||p.delay>0||q.delay>0)continue;
    if(rectsOverlap(p.rect(),q.rect())){ p.dead=true;q.dead=true; addSpark((p.x+q.x)/2,(p.y+q.y)/2,'#ffffff',14,5); SFX.block(); }
  }
  for(const ev of evs)applyHitEvent(ev.a,ev.d,ev.h,ev.dir,ev.isProj);
}
function pushboxes(){
  const [a,b]=GAME.f;
  const skip=['knockdown','ko','grabbed','locked'];
  if(skip.includes(a.state)||skip.includes(b.state)||a.hidden||b.hidden)return;
  if(Math.abs(a.y-b.y)>110)return;
  const minD=(a.def.w+b.def.w)/2*0.9;
  const dx=b.x-a.x;
  if(Math.abs(dx)<minD){
    const push=(minD-Math.abs(dx))/2;
    const s=dx>=0?1:-1;
    a.x-=push*s; b.x+=push*s;
    a.x=clamp(a.x,WALL,WORLD_W-WALL); b.x=clamp(b.x,WALL,WORLD_W-WALL);
    if(a.x===WALL||a.x===WORLD_W-WALL)b.x=a.x+s*minD;
    if(b.x===WALL||b.x===WORLD_W-WALL)a.x=b.x-s*minD;
    a.x=clamp(a.x,WALL,WORLD_W-WALL); b.x=clamp(b.x,WALL,WORLD_W-WALL);
  }
}

// ---------- projectiles & items ----------
class Proj{
  constructor(owner,type,x,y,dir,delay){
    this.owner=owner; this.type=type; this.spec=PROJSPECS[type];
    this.x=x; this.y=y; this.px=x; this.py=y;
    this.vx=this.spec.vx*dir; this.vy=this.spec.vy;
    this.delay=delay||0; this.life=this.spec.life; this.dead=false; this.hitUsed=false;
    this.bounced=false; this.spin=0;
  }
  rect(){ return {x:this.x-this.spec.w/2,y:this.y-this.spec.h/2,w:this.spec.w,h:this.spec.h}; }
  splat(){
    const k=this.spec.kind;
    if(k==='bomb'){ addSpark(this.x,this.y,'#ff9e00',22,8); addShake(4,0,0.5); noiseBurst(0.12,0.3,700); }
    else if(k==='bolt')addSpark(this.x,this.y,'#fff3b0',14,6);
    else addSpark(this.x,this.y,k==='seed'?'#333':'#ff5d6c',10,4);
  }
  update(){
    if(this.delay>0){ this.delay--; return; }
    this.px=this.x; this.py=this.y;
    this.vy+=this.spec.grav;
    this.x+=this.vx; this.y+=this.vy;
    this.spin+=0.2;
    if(this.y>=GROUND_Y-this.spec.h/2){
      if(this.spec.bounce&&!this.bounced){ this.bounced=true; this.vy=-Math.abs(this.vy)*0.6; this.y=GROUND_Y-this.spec.h/2; addDust(this.x,GROUND_Y,4); }
      else{ this.dead=true; this.splat(); }
    }
    if(--this.life<=0||this.x<-150||this.x>WORLD_W+150)this.dead=true;
  }
}
function doSpawn(f,s){
  if(s.type==='item'){
    ITEMS.push({x:clamp(f.x+f.facing*(60+grand()*140),WALL,WORLD_W-WALL),y:f.y-130,
      vx:f.facing*(0.5+grand()*1.5),vy:-5,type:ITEMTYPES[(grand()*ITEMTYPES.length)|0],t:640,land:false});
    SFX.coin();
    return;
  }
  if(s.type==='melonrain'){
    for(let i=0;i<8;i++){
      const x=clamp(f.x+f.facing*(100+i*150),WALL,WORLD_W-WALL);
      PROJS.push(new Proj(f,'rainmelon',x,-60-i*20,f.facing,i*7));
    }
    return;
  }
  if(s.type==='bombs'||s.type==='bombsEx'){
    const n=s.type==='bombs'?3:5;
    for(let i=0;i<n;i++)PROJS.push(new Proj(f,'bomb',clamp(f.x+f.facing*(120+i*110),WALL,WORLD_W-WALL),-40,f.facing,i*5));
    SFX.proj();
    return;
  }
  if(s.type==='bombrain'){
    for(let i=0;i<8;i++)PROJS.push(new Proj(f,'bomb',clamp(f.x+f.facing*(80+i*140),WALL,WORLD_W-WALL),-60-i*15,f.facing,i*6));
    return;
  }
  if(s.type==='smite'||s.type==='smiteEx'){
    const o=GAME.f[1-f.slot];
    const xs=s.type==='smite'?[0]:[-110,0,110];
    xs.forEach((ox,i)=>PROJS.push(new Proj(f,'smite',clamp(o.x+ox,WALL,WORLD_W-WALL),-140,f.facing,i*7)));
    SFX.freeze();
    return;
  }
  const spec=PROJSPECS[s.type];
  if(s.type==='seed'&&PROJS.filter(p=>p.owner===f&&p.type==='seed'&&!p.dead).length>=3)return;
  PROJS.push(new Proj(f,s.type,f.x+f.facing*48,f.y-spec.fy,f.facing,0));
  SFX.proj();
}
function updateItems(){
  for(let i=ITEMS.length-1;i>=0;i--){
    const it=ITEMS[i];
    if(!it.land){ it.vy+=0.3; it.x+=it.vx; it.y+=it.vy; if(it.y>=GROUND_Y-14){ it.y=GROUND_Y-14; it.land=true; addDust(it.x,GROUND_Y,2);} }
    if(--it.t<=0){ ITEMS.splice(i,1); continue; }
    for(const f of GAME.f){
      if(f.hidden||f.hp<=0)continue;
      if(['idle','walk','crouch','dash','land'].includes(f.state)&&Math.abs(f.x-it.x)<46&&Math.abs(f.y-it.y)<60){
        if(it.type==='snack'){ f.hp=Math.min(f.hpMax,f.hp+70); addSpark(f.x,f.y-90,'#06d6a0',12,4); }
        else if(it.type==='battery'){ f.meter=Math.min(100,f.meter+35); addSpark(f.x,f.y-90,'#ffd166',12,4); }
        else { f.installT=Math.max(f.installT,360); f.installSpeed=Math.max(f.installSpeed,1.22); addSpark(f.x,f.y-90,'#ff5d6c',12,4); }
        SFX.coin(); ITEMS.splice(i,1); break;
      }
    }
  }
}

// ---------- game / match flow ----------
const GAME={
  screen:'title', t:0, mode:'2p',
  f:[], wins:[0,0], round:1, timer:ROUND_SECS*60, phase:'intro', phaseT:0,
  winner:null, finVictim:null, FIN:null, koT:0, perfect:false, finishedName:'',
  sel:{p1:0,p2:1,c1:false,c2:false}, vsT:0,
  combo:[{n:0,t:0},{n:0,t:0}],
  banner:null, matchOver:false, timeout:false,
};
function showBanner(text,dur,sub,color){ GAME.banner={text,dur,t:0,sub:sub||'',color:color||'#fff'}; }

function initMatch(id1,id2){
  const mirror=id1===id2;
  const pad1=GAME.mode==='1p'?SOLOPAD:PADS[0];
  const pad2=GAME.mode==='1p'?AIPAD:PADS[1];
  GAME.f=[new Fighter(id1,0,pad1,0),new Fighter(id2,1,pad2,mirror?1:0)];
  GAME.wins=[0,0]; GAME.round=1; GAME.matchOver=false; GAME.finishedName='';
  RNG.s=((Date.now?Date.now():0)^0x5eed)>>>0||1234567;
  resetRound();
  GAME.screen='fight';
}
function resetRound(){
  const [f1,f2]=GAME.f;
  for(const [f,sx] of [[f1,-220],[f2,220]]){
    f.x=WORLD_W/2+sx; f.y=GROUND_Y; f.px=f.x; f.py=f.y; f.vx=0; f.vy=0;
    f.hp=f.hpMax; f.recov=0; f.setState('idle');
    f.facing=f.slot===0?1:-1; f.hidden=false; f.move=null; f.buf=null;
    f.installT=0; f.slowT=0; f.grabVictim=null; f.grabbedBy=null;
    f.comboTaken=0; f.juggleN=0; f.gravScale=1; f.koBounced=false; f.koVy=0;
    f.stunT=0; f.staggerT=0; f.dispHp=f.hpMax; f.cine=null;
  }
  PROJS.length=0; ITEMS.length=0; PARTS.length=0;
  FXS.hitstop=0; FXS.superfx=0; FXS.flash=0; SHAKE.p=0;
  GAME.timer=ROUND_SECS*60; GAME.phase='intro'; GAME.phaseT=0;
  GAME.winner=null; GAME.finVictim=null; GAME.FIN=null; GAME.koT=0;
  GAME.perfect=false; GAME.timeout=false;
  GAME.combo=[{n:0,t:0},{n:0,t:0}];
  CAM.tzoom=1;
  showBanner(GAME.round<3?'ROUND '+GAME.round:'FINAL ROUND',60,'','#fff');
  say('ROUND '+GAME.round);
}
GAME.beginKO=function(a,d,dir,launch){
  GAME.phase='ko'; GAME.winner=a; GAME.wins[a.slot]++;
  GAME.koT=170;
  GAME.perfect=a.hp>=a.hpMax-0.5;
  d.hidden=false;
  d.setState('ko');
  if(launch!==false){ d.vy=-11; d.vx=(dir||a.facing)*7*d.def.weight; d.y=Math.min(d.y,GROUND_Y-1); }
  showBanner('K.O.!',90,GAME.perfect?'FLAWLESS AURA':'','#ff3860');
  say('K O'); SFX.ko(); addShake(12,dir||1,-1); FXS.hitstop=Math.max(FXS.hitstop,14); FXS.flash=8;
};
GAME.beginFinish=function(a,d){
  GAME.phase='finish'; GAME.winner=a; GAME.finVictim=d;
  d.setState('stagger'); d.staggerT=250; d.hp=0;
  a.buf=null;
  showBanner('FINISH THEM!',120,a.def.finisher.hint+'  =  '+a.def.finisher.name,'#ffd166');
  say('FINISH THEM'); SFX.stagger();
  CAM.tzoom=1.15;
};
GAME.staggerExpired=function(d){
  if(GAME.phase!=='finish')return;
  GAME.beginKO(GAME.winner,d,GAME.winner.facing,false);
  d.vx=GAME.winner.facing*1.5; d.vy=-3; d.y=GROUND_Y-1;
};
GAME.beginCine=function(a,d){
  GAME.phase='cine'; GAME.wins[a.slot]++;
  GAME.FIN={t:0,a,d,id:a.defId,dur:FINSCRIPTS[a.defId].dur};
  GAME.finishedName=a.def.finisher.name;
  d.setState('locked'); d.cine={sx:1,sy:1,rot:0,alpha:1};
  a.setState('locked');
  CAM.tzoom=1.45; FXS.superfx=40; FXS.flash=12; FXS.hitstop=0;
  showBanner(a.def.finisher.name,100,'','#ff3860');
  say(a.def.finisher.name); SFX.super(); addShake(10,0,1);
};
function endCine(){
  GAME.FIN.d.hidden=true; GAME.FIN.d.cine=null;
  GAME.phase='ko'; GAME.koT=170; CAM.tzoom=1;
  showBanner('FINISHED!!',100,GAME.finishedName,'#ffd166');
  say('FINISHED'); SFX.confetti();
  addConfetti(GAME.FIN.d.x,GROUND_Y-150,80);
}
function timeUp(){
  const [f1,f2]=GAME.f;
  const r1=f1.hp/f1.hpMax, r2=f2.hp/f2.hpMax;
  GAME.timeout=true;
  if(Math.abs(r1-r2)<0.001){ showBanner('DRAW',90,'','#fff'); say('DRAW'); GAME.phase='ko'; GAME.winner=null; GAME.koT=150; return; }
  const w=r1>r2?f1:f2, l=r1>r2?f2:f1;
  GAME.phase='ko'; GAME.winner=w; GAME.wins[w.slot]++; GAME.koT=170;
  l.setState('ko'); l.vx=0; l.vy=-2; l.y=GROUND_Y-1;
  showBanner('TIME!',90,'','#fff'); say('TIME');
}
function advanceAfterKO(){
  if(GAME.winner&&GAME.wins[GAME.winner.slot]>=ROUNDS_TO_WIN){
    const w=GAME.winner;
    GAME.victor={defId:w.defId,palIdx:w.palIdx,name:w.def.name,quote:w.def.winQuote,slot:w.slot};
    GAME.matchOver=true; GAME.screen='victory'; GAME.t=0;
    addConfetti(W/2+CAM.x,300,60); SFX.confetti(); say('WINNER');
  }else{
    GAME.round++; resetRound();
  }
}

// ---------- fight tick ----------
function updateFight(){
  const [f1,f2]=GAME.f;
  if(GAME.mode==='1p'&&f2.pad.ai&&(GAME.phase==='active'||GAME.phase==='finish'))aiThink(f2,f1);
  f1.pad.poll(f1.facing); f2.pad.poll(f2.facing);
  const acting=GAME.phase==='active'||GAME.phase==='finish';
  for(const f of GAME.f){
    if(!acting)continue;
    if(GAME.phase==='finish'&&f!==GAME.winner)continue;
    const cmd=detectCommand(f);
    if(cmd)f.buf={cmd,t:tickCount};
    if(f.pad.dashEvent){ f.dashBuf=f.pad.dashEvent; f.dashBufT=tickCount; }
    // hitstop freezes the buffer clock — inputs buffered during freeze stay live
    if(FXS.hitstop>0){ if(f.buf)f.buf.t++; f.dashBufT++; }
    if(f.dashBuf&&tickCount-f.dashBufT>6)f.dashBuf=0;
    if(f.buf&&tickCount-f.buf.t>8)f.buf=null;
  }
  if(FXS.hitstop>0){ FXS.hitstop--; }
  else{
    f1.px=f1.x; f1.py=f1.y; f2.px=f2.x; f2.py=f2.y;
    if(GAME.phase==='intro'){
      GAME.phaseT++;
      if(GAME.phaseT===60){ showBanner('FIGHT!',40,'','#ffd166'); say('FIGHT'); }
      if(GAME.phaseT>=90)GAME.phase='active';
    }
    else if(GAME.phase==='active'||GAME.phase==='finish'){
      f1.update(f2); f2.update(f1);
      pushboxes();
      for(const p of PROJS)p.update();
      for(let i=PROJS.length-1;i>=0;i--)if(PROJS[i].dead)PROJS.splice(i,1);
      updateItems();
      resolveCombat();
      if(GAME.phase==='active'){
        if(--GAME.timer<=0)timeUp();
      }else{
        // finisher input check
        const a=GAME.winner, fin=a.def.finisher;
        if(a.pad.pressedNow(fin.btn)&&a.pad.matchMotion(fin.seq,45)&&!a.airborne()){
          GAME.beginCine(a,GAME.finVictim);
        }
      }
    }
    else if(GAME.phase==='ko'){
      f1.update(f2); f2.update(f1);
      GAME.koT--;
      if(GAME.koT===110&&GAME.winner)GAME.winner.setState('win');
      if(GAME.koT===100&&GAME.winner)addConfetti(GAME.winner.x,GAME.winner.y-120,30);
      if(GAME.koT<=0)advanceAfterKO();
    }
    else if(GAME.phase==='cine'){
      const F=GAME.FIN; F.t++;
      FINSCRIPTS[F.id].update(F);
      if(F.t>=F.dur)endCine();
    }
    updateParts();
    MUSIC.update();
  }
  // camera — dynamic zoom: tight when close, wide when apart
  let tx;
  if(GAME.phase==='cine'){ tx=clamp(GAME.FIN.d.x-W/2/CAM.tzoom,0,WORLD_W-W/CAM.tzoom); CAM.fx=GAME.FIN.d.x; }
  else{
    CAM.tzoom=clamp(1.85-Math.abs(f1.x-f2.x)/600,1.08,1.52);
    const mid=(f1.x+f2.x)/2; tx=clamp(mid-W/2/CAM.zoom,0,WORLD_W-W/CAM.zoom); CAM.fx=mid;
  }
  CAM.x=lerp(CAM.x,tx,0.12);
  CAM.zoom=lerp(CAM.zoom,CAM.tzoom,0.08);
  SHAKE.p*=0.86; if(SHAKE.p<0.25)SHAKE.p=0;
  if(FXS.superfx>0)FXS.superfx--;
  if(FXS.flash>0)FXS.flash--;
  for(const c of GAME.combo)if(c.t>0)c.t--;
  if(GAME.banner){ GAME.banner.t++; if(GAME.banner.t>GAME.banner.dur)GAME.banner=null; }
}

function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function grad(c,x0,y0,x1,y1,a,b){ const g=c.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,a); g.addColorStop(1,b); return g; }

// ---------- faces ----------
function face(c,x,y,s,mood,t){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle='#1b1026'; c.strokeStyle='#1b1026'; c.lineWidth=2.5; c.lineCap='round';
  const blink=(Math.floor(t/90)%7===0)&&mood==='idle';
  if(mood==='hurt'){
    for(const ex of [-11,11]){ c.beginPath(); c.moveTo(ex-5,-5);c.lineTo(ex+5,5);c.moveTo(ex+5,-5);c.lineTo(ex-5,5); c.stroke(); }
    c.beginPath(); c.arc(0,12,6,0,Math.PI,true); c.stroke();
  }else if(mood==='block'){
    for(const ex of [-11,11]){ c.beginPath(); c.moveTo(ex-5,0);c.lineTo(ex+5,0); c.stroke(); }
    c.beginPath(); c.moveTo(-6,12); c.lineTo(6,12); c.stroke();
  }else if(mood==='dizzy'){
    for(const ex of [-11,11]){ c.beginPath(); c.arc(ex,0,5,t*0.3,t*0.3+4.5); c.stroke(); }
    c.beginPath(); c.arc(0,13,5,0.3,Math.PI-0.3); c.stroke();
  }else if(mood==='win'){
    for(const ex of [-11,11]){ c.beginPath(); c.moveTo(ex-5,1);c.lineTo(ex,-4);c.lineTo(ex+5,1); c.stroke(); }
    c.beginPath(); c.arc(0,8,8,0.2,Math.PI-0.2); c.stroke();
  }else if(mood==='angry'){
    for(const [ex,sn] of [[-11,-1],[11,1]]){ c.beginPath(); c.moveTo(ex-5*sn,-7); c.lineTo(ex+5*sn,-3); c.stroke();
      c.beginPath(); c.arc(ex,2,3.4,0,TAU); c.fill(); }
    c.beginPath(); c.moveTo(-6,13); c.lineTo(7,10); c.stroke();
  }else{
    for(const ex of [-11,11]){ if(blink){c.beginPath();c.moveTo(ex-4,0);c.lineTo(ex+4,0);c.stroke();}
      else{c.beginPath(); c.arc(ex,0,3.6,0,TAU); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(ex+1.3,-1.3,1.2,0,TAU); c.fill(); c.fillStyle='#1b1026';} }
    c.beginPath(); c.arc(1,9,5.5,0.2,Math.PI-0.4); c.stroke();
  }
  c.restore();
}
function limbTo(c,P,sx,sy,color,thick){
  const ex=P.tx*Math.max(P.ext,0.12), ey=-P.ty;
  c.strokeStyle=color; c.lineWidth=thick; c.lineCap='round';
  c.beginPath(); c.moveTo(sx,sy);
  c.quadraticCurveTo((sx+ex)/2,Math.min(sy,ey)-16,ex,ey);
  c.stroke();
  return [ex,ey];
}

// ---------- fighter pose + composite ----------
function poseFor(f){
  const pal=f.def.pal[f.palIdx];
  let mood='idle';
  if(['hitstun','juggle','knockdown','ko','grabbed'].includes(f.state))mood='hurt';
  else if(f.state==='block'||f.state==='blockstun')mood='block';
  else if(f.state==='stagger')mood='dizzy';
  else if(f.state==='win')mood='win';
  else if(f.state==='attack')mood='angry';
  let ext=0,tx=60,ty=80,limb=null;
  if(f.state==='attack'&&f.move){
    const m=f.move; limb=m.limb||'arm';
    let sfr=10,efr=14;
    if(m.hits&&m.hits.length){
      let h=m.hits[0];
      for(const hh of m.hits){ if(f.st>=hh.s-6&&f.st<=hh.e+5){h=hh;break;} if(f.st>hh.e)h=hh; }
      tx=h.fx; ty=h.fy; sfr=h.s; efr=h.e;
    }else if(m.grab){ tx=m.grab.range*0.75; ty=80; sfr=m.grab.s; efr=m.grab.release||m.grab.e; }
    else if(m.spawn){ tx=55; ty=95; sfr=m.spawn[0].f-4; efr=m.spawn[0].f+8; }
    else if(m.install){ tx=30; ty=120; sfr=6; efr=20; }
    if(f.st<sfr)ext=clamp(f.st/Math.max(1,sfr),0,1)*0.45;
    else if(f.st<=efr)ext=1;
    else ext=Math.max(0,1-(f.st-efr)/8);
  }
  return {t:tickCount+f.slot*13,ext,tx,ty,limb,pal,mood,f};
}
function drawFighter(c,f,alpha){
  if(f.hidden)return;
  const ix=lerp(f.px,f.x,alpha), iy=lerp(f.py,f.y,alpha);
  // shadow
  const airH=clamp((GROUND_Y-iy)/220,0,1);
  c.fillStyle='rgba(10,5,25,'+(0.35-airH*0.2)+')';
  c.beginPath(); c.ellipse(ix,GROUND_Y+10,f.def.w*0.75*(1-airH*0.4),9,0,0,TAU); c.fill();
  c.save(); c.translate(ix,iy);
  if(f.cine){ c.globalAlpha=f.cine.alpha; c.rotate(f.cine.rot); c.scale(f.cine.sx,f.cine.sy); }
  c.scale(f.facing,1);
  // state deformation
  if(f.state==='knockdown'||f.state==='ko'&&!f.airborne())c.rotate(-1.45);
  else if(f.state==='juggle'||f.state==='ko')c.rotate(-Math.min(f.st*0.12,5.5));
  else if(f.state==='stagger')c.rotate(Math.sin(f.st*0.22)*0.17);
  else if(f.state==='hitstun')c.rotate(-0.14);
  else if(f.state==='run')c.rotate(0.14); // forward lean into the sprint
  let sx=1,sy=1;
  if(f.squashT>0){ sy=0.8+0.2*(1-f.squashT/8); sx=2-sy; }
  else if(f.airborne()&&f.vy<-4){ sy=1.12; sx=0.92; }
  else if(f.state==='crouch'||(f.state==='attack'&&f.move&&f.move.crouch)){ sy=0.72; sx=1.12; }
  else if(f.state==='idle'||f.state==='walk'){ sy=1+Math.sin((tickCount+f.slot*13)*0.09)*0.022; sx=1-(sy-1)*0.7; }
  c.scale(sx,sy);
  if(tickCount-f.lastHurtT<5)c.filter='brightness(1.9)';
  CHARS[f.defId].draw(c,f,poseFor(f));
  c.filter='none';
  if(f.slowT>0){ c.fillStyle='rgba(120,205,255,0.32)'; rr(c,-f.def.w/2-6,-f.def.h-8,f.def.w+12,f.def.h+8,14); c.fill(); }
  if(f.armorFlash>0){ c.strokeStyle='rgba(255,255,140,0.8)'; c.lineWidth=4; rr(c,-f.def.w/2-6,-f.def.h-8,f.def.w+12,f.def.h+8,14); c.stroke(); }
  // block shield
  if(f.state==='block'||f.state==='blockstun'){
    c.strokeStyle='rgba(87,199,255,0.75)'; c.lineWidth=5;
    const bh=f.blockLow?55:95;
    c.beginPath(); c.arc(f.def.w*0.62,-bh*0.8,bh*0.62,-1.15,1.15); c.stroke();
  }
  // dizzy stars
  if(f.state==='stagger'){
    c.fillStyle='#ffd166'; c.font='900 20px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
    for(let i=0;i<3;i++){ const a=tickCount*0.11+i*2.1;
      c.fillText('★',Math.cos(a)*34-8,-f.def.h-14+Math.sin(a)*9); }
  }
  c.restore();
}

// ---------- background ----------
function drawBGWorld(c){
  const par=p=>CAM.x*(1-p);
  // nebula donut (far)
  c.save(); c.translate(par(0.12),0);
  c.save(); c.translate(1000,170); c.rotate(tickCount*0.002);
  c.strokeStyle='rgba(199,125,255,0.3)'; c.lineWidth=36;
  c.beginPath(); c.arc(0,0,120,0,TAU); c.stroke();
  c.strokeStyle='rgba(76,201,240,0.22)'; c.lineWidth=14;
  c.beginPath(); c.arc(0,0,170,0,TAU); c.stroke();
  c.restore(); c.restore();
  // hills
  c.save(); c.translate(par(0.3),0);
  c.fillStyle='#2a1743';
  c.beginPath(); c.moveTo(-400,GROUND_Y+20);
  for(let x=-400;x<=WORLD_W+400;x+=200)c.quadraticCurveTo(x+100,GROUND_Y-150-((x*0.7)%90),x+200,GROUND_Y+20);
  c.closePath(); c.fill();
  c.restore();
  // floating shapes + blimp
  c.save(); c.translate(par(0.5),0);
  for(let i=0;i<7;i++){
    const fx=(i*331)%WORLD_W, fy=110+((i*173)%200)+Math.sin(tickCount*0.02+i)*14;
    c.save(); c.translate(fx,fy); c.rotate(tickCount*0.01*(i%2?1:-1)+i);
    c.fillStyle=['rgba(255,93,143,0.5)','rgba(255,209,102,0.5)','rgba(76,201,240,0.5)'][i%3];
    if(i%3===0){ c.fillRect(-14,-14,28,28); }
    else if(i%3===1){ c.beginPath(); for(let k=0;k<5;k++){const a=k*TAU/5-Math.PI/2; c.lineTo(Math.cos(a)*17,Math.sin(a)*17); const b=a+TAU/10; c.lineTo(Math.cos(b)*7,Math.sin(b)*7);} c.closePath(); c.fill(); }
    else { c.beginPath(); c.arc(0,0,15,0,TAU); c.fill(); c.fillStyle='#0a0618'; c.beginPath(); c.arc(0,0,6,0,TAU); c.fill(); }
    c.restore();
  }
  const bx=((tickCount*0.7)%(WORLD_W+800))-400;
  c.fillStyle='#c77dff'; c.beginPath(); c.ellipse(bx,90,70,24,0,0,TAU); c.fill();
  c.fillStyle='#1b1026'; c.fillRect(bx-40,108,80,14);
  c.fillStyle='#ffd166'; c.font='900 10px "Arial Black","Archivo Black","DejaVu Sans",sans-serif'; c.textAlign='center';
  c.fillText('MORTAL BRAINROT',bx,118); c.textAlign='left';
  c.restore();
  // crowd of bouncing blobs
  c.save(); c.translate(par(0.82),0);
  for(let i=0;i<26;i++){
    const cx=i*80+30, hop=Math.abs(Math.sin(tickCount*0.09+i*1.7))*14;
    c.fillStyle=['#5e4b8b','#7a5ba6','#4b3a70'][i%3];
    c.beginPath(); c.ellipse(cx,GROUND_Y-8-hop,16,22,0,0,TAU); c.fill();
    c.fillStyle='#0a0618';
    c.beginPath(); c.arc(cx-5,GROUND_Y-16-hop,2,0,TAU); c.arc(cx+5,GROUND_Y-16-hop,2,0,TAU); c.fill();
  }
  c.restore();
  // floor
  const fg=grad(c,0,GROUND_Y,0,H+220,'#3d2b63','#171029');
  c.fillStyle=fg; c.fillRect(-400,GROUND_Y,WORLD_W+800,400);

  for(let x=0;x<WORLD_W;x+=100)c.fillRect(x+((x/100)%2)*50,GROUND_Y,50,400);
  c.fillStyle='rgba(199,125,255,0.5)'; c.fillRect(-400,GROUND_Y,WORLD_W+800,3);
  // walls glow
  c.fillStyle='rgba(255,93,143,0.12)';
  c.fillRect(WALL-40,0,40,GROUND_Y); c.fillRect(WORLD_W-WALL,0,40,GROUND_Y);
}
function drawProj(c,p,alpha){
  if(p.delay>0)return;
  const ix=lerp(p.px,p.x,alpha), iy=lerp(p.py,p.y,alpha);
  c.save(); c.translate(ix,iy); c.rotate(p.spin*Math.sign(p.vx||1));
  if(p.spec.kind==='bolt'){
    c.rotate(-p.spin*Math.sign(p.vx||1)); // bolts don't spin
    c.fillStyle='rgba(255,243,176,0.9)';
    c.beginPath(); c.moveTo(-14,-100); c.lineTo(6,-30); c.lineTo(-4,-30); c.lineTo(14,60);
    c.lineTo(18,100); c.lineTo(-2,40); c.lineTo(8,40); c.lineTo(-18,-100); c.closePath(); c.fill();
    c.strokeStyle='#ffd166'; c.lineWidth=3; c.stroke();
  }else if(p.spec.kind==='bomb'){
    c.fillStyle='#2f3542'; c.beginPath(); c.ellipse(0,0,12,16,0,0,TAU); c.fill();
    c.fillStyle='#ff5d6c'; c.beginPath(); c.ellipse(0,-14,5,4,0,0,TAU); c.fill();
    c.fillStyle='#57606f'; c.fillRect(-9,10,6,8); c.fillRect(3,10,6,8);
    c.fillStyle='#fff'; c.beginPath(); c.ellipse(-4,-4,3,4,0.4,0,TAU); c.fill();
  }else if(p.spec.kind==='seed'){
    c.fillStyle='#1b1b1b'; c.beginPath(); c.ellipse(0,0,12,7,0,0,TAU); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.ellipse(-3,-2,3,1.6,0,0,TAU); c.fill();
  }else{
    const r=p.spec.w/2;
    c.fillStyle='#2e9e4f'; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
    c.strokeStyle='#14622c'; c.lineWidth=4;
    for(const a of [0.4,1.6,2.8]){ c.beginPath(); c.arc(0,0,r-2,a,a+0.7); c.stroke(); }
  }
  c.restore();
}
function drawItem(c,it){
  c.save(); c.translate(it.x,it.y+Math.sin(tickCount*0.1)*2);
  c.fillStyle='rgba(255,255,200,0.25)'; c.beginPath(); c.arc(0,0,20,0,TAU); c.fill();
  if(it.type==='snack'){ c.fillStyle='#ffd166'; rr(c,-12,-8,24,16,4); c.fill(); c.fillStyle='#06d6a0'; c.fillRect(-12,-3,24,4); }
  else if(it.type==='battery'){ c.fillStyle='#06d6a0'; rr(c,-8,-12,16,24,3); c.fill(); c.fillStyle='#fff'; c.fillRect(-3,-16,6,4); }
  else { c.fillStyle='#ff5d6c'; rr(c,-7,-13,14,26,6); c.fill(); c.fillStyle='#fff'; c.fillRect(-7,-4,14,3); }
  c.restore();
}

      c.fillStyle='rgba(150,215,255,0.85)'; rr(c,-45,-70,90,140,16); c.fill();

  }},

// ---------- scene assembly ----------
function worldTransform(c){
  c.translate(0,(1-CAM.zoom)*H*0.92);
  c.scale(CAM.zoom,CAM.zoom);
  c.translate(-CAM.x,0);
}
function drawScene(alpha){
  const c=sctx;
  c.setTransform(1,0,0,1,0,0);
  c.filter='none'; c.globalAlpha=1; c.globalCompositeOperation='source-over';
  const sky=grad(c,0,0,0,H,'#1b0f38','#4a1a5e');
  c.fillStyle=sky; c.fillRect(0,0,W,H);
  c.save(); worldTransform(c);
  drawBGWorld(c);
  for(const it of ITEMS)drawItem(c,it);
  if(GAME.f.length===2){
    const [f1,f2]=GAME.f;
    const order=f1.state==='attack'?[f2,f1]:[f1,f2];
    drawFighter(c,order[0],alpha); drawFighter(c,order[1],alpha);
  }
  for(const p of PROJS)drawProj(c,p,alpha);
  if(GAME.phase==='cine'&&GAME.FIN)FINSCRIPTS[GAME.FIN.id].draw(c,GAME.FIN);
  // particles
  for(const p of PARTS){
    c.globalAlpha=clamp(p.life/p.max,0,1);
    if(p.kind==='confetti'){ c.save(); c.translate(p.x,p.y); c.rotate(p.rot||0); c.fillStyle=p.color; c.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2); c.restore(); }
    else { c.fillStyle=p.color; c.beginPath(); c.arc(p.x,p.y,p.sz*(p.life/p.max),0,TAU); c.fill(); }
  }
  c.globalAlpha=1;
  if(DEBUG&&GAME.f.length===2)drawDebugWorld(c);
  c.restore();
}
function drawDebugWorld(c){
  for(const f of GAME.f){
    if(f.hidden)continue;
    const hb=hurtboxFor(f);
    c.strokeStyle='rgba(0,255,120,0.9)'; c.lineWidth=2; c.strokeRect(hb.x,hb.y,hb.w,hb.h);
    c.strokeStyle='rgba(80,140,255,0.7)';
    c.strokeRect(f.x-f.def.w*0.45,f.y-40,f.def.w*0.9,40);
    if(f.state==='attack'&&f.move&&f.move.hits){
      f.move.hits.forEach((h,i)=>{
        if(f.st>=h.s&&f.st<=h.e){ const r=hitRectWorld(f,h);
          c.fillStyle='rgba(255,40,60,0.35)'; c.fillRect(r.x,r.y,r.w,r.h);
          c.strokeStyle='rgba(255,40,60,0.9)'; c.strokeRect(r.x,r.y,r.w,r.h); }
      });
    }
    if(f.state==='attack'&&f.move&&f.move.grab&&f.st>=f.move.grab.s&&f.st<=f.move.grab.e){
      c.strokeStyle='rgba(255,200,0,0.9)';
      c.strokeRect(f.x,f.y-100,f.move.grab.range*f.facing,100);
    }
  }
  for(const p of PROJS){ if(p.delay>0)continue; const r=p.rect();
    c.strokeStyle='rgba(255,40,60,0.9)'; c.strokeRect(r.x,r.y,r.w,r.h); }
}

// ---------- HUD ----------
function drawHealth(c,f,x,y,w,rightAlign){
  f.dispHp+=(f.hp-f.dispHp)*0.1;
  c.save(); c.transform(1,0,rightAlign?0.22:-0.22,1,x,y);
  c.fillStyle='rgba(0,0,0,0.65)'; rr(c,-3,-3,w+6,28,6); c.fill();
  const frac=clamp(f.hp/f.hpMax,0,1), dfrac=clamp(f.dispHp/f.hpMax,0,1), rfrac=clamp((f.hp+f.recov)/f.hpMax,0,1);
  const seg=(fr,color)=>{ const ww=w*fr; c.fillStyle=color;
    if(rightAlign)c.fillRect(w-ww,0,ww,22); else c.fillRect(0,0,ww,22); };
  seg(dfrac,'#a8253e');
  seg(rfrac,'#7fdc9a');
  seg(frac, frac>0.35?'#41d97a':'#ffd166');
  c.strokeStyle='#fff'; c.lineWidth=2; rr(c,-3,-3,w+6,28,6); c.stroke();
  c.restore();
  c.fillStyle='#fff'; c.font='900 15px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
  c.textAlign=rightAlign?'right':'left';
  c.fillText(f.def.name,rightAlign?x+w-4:x+4,y+48);
  c.fillStyle='#c77dff'; c.font='900 11px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
  c.fillText(f.def.archetype,rightAlign?x+w-4:x+4,y+63);
  c.textAlign='left';
}
function drawMeter(c,f,x,y,w,rightAlign){
  c.save(); c.translate(x,y);
  c.fillStyle='rgba(0,0,0,0.65)'; rr(c,-3,-3,w+6,20,5); c.fill();
  const frac=clamp(f.meter/100,0,1), ww=w*frac;
  const full=f.meter>=100;
  c.fillStyle=full?'#fff3b0':'#ffb703';

// ---------- screen updates ----------
function updateTitle(){
  GAME.t++;
  const go=mode=>{ GAME.mode=mode; GAME.screen='select';
    GAME.sel={p1:0,p2:1,c1:false,c2:false,t:0,cpuT:0}; SFX.coin(); };
  const any=l=>l.some(k=>KEY.pressed.has(k));
  if(any(['KeyF','Enter','Numpad1','GP0L','GP1L','GP0Start','GP1Start']))go('1p');
  else if(any(['KeyG','Numpad2','GP0H','GP1H']))go('2p');
}
function updateSelect(){
  const s=GAME.sel, N=ROSTER.length;
  const solo=GAME.mode==='1p';
  const p1has=list=>list.some(k=>KEY.pressed.has(k));
  const gpAll=s2=>['GP0'+s2,'GP1'+s2], gp0=s2=>['GP0'+s2];
  if(!s.c1){
    if(p1has((solo?['KeyA','ArrowLeft']:['KeyA']).concat(solo?gpAll('Left'):gp0('Left')))){s.p1=(s.p1+N-1)%N;SFX.block();}
    if(p1has((solo?['KeyD','ArrowRight']:['KeyD']).concat(solo?gpAll('Right'):gp0('Right')))){s.p1=(s.p1+1)%N;SFX.block();}
    if(p1has((solo?['KeyW','KeyS','ArrowUp','ArrowDown']:['KeyW','KeyS']).concat(solo?gpAll('Up').concat(gpAll('Down')):gp0('Up').concat(gp0('Down'))))){s.p1=(s.p1+4)%N;SFX.block();}
    if(p1has((solo?['KeyF','Numpad1','Comma']:['KeyF']).concat(solo?gpAll('L'):gp0('L')))){s.c1=true;SFX.coin();say(CHARS[ROSTER[s.p1]].name);}
  }else if(p1has((solo?['KeyG','Numpad2','Period']:['KeyG']).concat(solo?gpAll('H'):gp0('H'))))s.c1=false;
  if(GAME.mode==='1p'){
    if(s.c1&&!s.c2){
      s.cpuT=(s.cpuT||0)+1;
      if(s.cpuT<28){ if(s.cpuT%3===0)s.p2=(grand()*N)|0; }
      else { s.c2=true; SFX.coin(); say(CHARS[ROSTER[s.p2]].name); }
    }
    if(!s.c1)s.cpuT=0, s.c2=false;
  }else{
    const p2has=list=>list.some(k=>KEY.pressed.has(k));
    if(!s.c2){
      if(p2has(['ArrowLeft','GP1Left'])){s.p2=(s.p2+N-1)%N;SFX.block();}
      if(p2has(['ArrowRight','GP1Right'])){s.p2=(s.p2+1)%N;SFX.block();}
      if(p2has(['ArrowUp','ArrowDown','GP1Up','GP1Down'])){s.p2=(s.p2+4)%N;SFX.block();}
      if(p2has(['Numpad1','Comma','GP1L'])){s.c2=true;SFX.coin();say(CHARS[ROSTER[s.p2]].name);}
    }else if(p2has(['Numpad2','Period','GP1H']))s.c2=false;
  }
  if(s.c1&&s.c2){
    s.t=(s.t||0)+1;
    if(s.t===45){ GAME.selIds=[ROSTER[s.p1],ROSTER[s.p2]]; GAME.screen='vs'; GAME.vsT=110; say('VERSUS'); }
  }else s.t=0;
}
function updateVictory(){
  GAME.t++;
  updateParts();
  const any=l=>l.some(k=>KEY.pressed.has(k));
  if(any(['KeyF','Numpad1','Comma','GP0L','GP1L'])){ initMatch(GAME.selIds[0],GAME.selIds[1]); SFX.coin(); }
  else if(any(['KeyG','Numpad2','Period','GP0H','GP1H'])){
    GAME.screen='select'; GAME.sel={p1:ROSTER.indexOf(GAME.selIds[0]),p2:ROSTER.indexOf(GAME.selIds[1]),c1:false,c2:false,t:0}; SFX.coin();
  }
}

// ---------- master tick / render / loop ----------
function tick(){
  tickCount++;
  pollGamepads();
  latchKeys();
  if((KEY.pressed.has('Escape')||KEY.pressed.has('GP0Start')||KEY.pressed.has('GP1Start'))&&GAME.screen==='fight')PAUSED=!PAUSED;
  if(PAUSED)return;
  switch(GAME.screen){
    case 'title': updateTitle(); break;
    case 'select': updateSelect(); break;
    case 'vs': if(--GAME.vsT<=0)initMatch(GAME.selIds[0],GAME.selIds[1]); break;
    case 'fight': updateFight(); break;
    case 'victory': updateVictory(); break;
  }
}
function render(alpha){
  if(!ctx)return;
  drawScene(alpha);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const shx=SHAKE.p?(Math.random()*2-1)*SHAKE.p+SHAKE.dx*SHAKE.p*0.4:0;
  const shy=SHAKE.p?(Math.random()*2-1)*SHAKE.p*0.7+SHAKE.dy*SHAKE.p*0.4:0;
  ctx.drawImage(scv,shx,shy);
  if(FXS.superfx>0){
    const k=FXS.superfx/50;
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.22*k;
    ctx.drawImage(scv,shx-7*k,shy); ctx.drawImage(scv,shx+7*k,shy);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,'+(0.2*k)+')';
    for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  }
  if(FXS.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(FXS.flash/14)+')'; ctx.fillRect(0,0,W,H); }
  if(GAME.screen==='fight'){ drawHUD(ctx); drawComboCounters(ctx);
    if(GAME.phase==='finish'){ // pulsing finisher hint
      ctx.textAlign='center'; ctx.font='900 20px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
      ctx.fillStyle='rgba(255,209,102,'+(0.6+Math.sin(tickCount*0.2)*0.4)+')';
      ctx.fillText(GAME.winner.def.finisher.hint+'  →  '+GAME.winner.def.finisher.name,W/2,660);
      ctx.textAlign='left';
    }
  }
  drawBannerFn(ctx);
  if(GAME.screen==='title')drawTitle(ctx);
  if(GAME.screen==='select')drawSelect(ctx);
  if(GAME.screen==='vs')drawVS(ctx);
  if(GAME.screen==='victory')drawVictory(ctx);
  if(PAUSED){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.font='900 48px "Arial Black","Archivo Black","DejaVu Sans",sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText('PAUSED',W/2,H/2); ctx.textAlign='left'; }
  if(DEBUG&&GAME.screen==='fight')drawDebugPanel(ctx);
}
// fixed timestep: 60Hz logic, interpolated render
let acc=0,lastT=now();
function frame(){
  const t=now(); acc+=t-lastT; lastT=t;
  if(acc>250)acc=250;
  while(acc>=TICK_MS){ tick(); acc-=TICK_MS; }
  render(acc/TICK_MS);
  requestAnimationFrame(frame);
}
if(typeof requestAnimationFrame!=='undefined')requestAnimationFrame(frame);

  setDebug:v=>{DEBUG=v;}};
if(typeof window!=='undefined')window.MB=MB;
else if(typeof globalThis!=='undefined')globalThis.MB=MB;

      c.save(); c.translate(e.x,e.y); c.scale(pop,pop);
      c.fillStyle='#e8eef7'; rr(c,-70,-28,140,60,6); c.fill();
      c.fillStyle='#4361ee'; rr(c,-70,-28,140,16,6); c.fill(); c.fillRect(-70,-18,140,6);
      c.fillStyle='#ff3860'; c.beginPath(); c.arc(58,-20,6,0,TAU); c.fill();
      c.fillStyle='#fff'; c.font='900 9px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
      c.fillText('FATAL LORE ERROR',-64,-16);
      c.fillStyle='#57606f'; c.font='10px monospace';
      c.fillText('character not found',-58,4); c.fillText('in current canon',-58,18);
      c.restore();
    }
    if(t>180&&t<270){
      c.textAlign='center'; c.globalAlpha=Math.min(1,(t-180)/15)*(t>240?(270-t)/30:1);
      c.font='900 110px "Arial Black","Archivo Black","DejaVu Sans",sans-serif';
      c.lineJoin='round'; c.strokeStyle='#1b1026'; c.lineWidth=14;
      c.strokeText('404',d.x,GROUND_Y-200);
      c.fillStyle='#b880ff'; c.fillText('404',d.x,GROUND_Y-200);
      c.globalAlpha=1; c.textAlign='left';
    }
  }};

// ---------- CPU opponent ----------
const AIPAD={
  ai:true, dir:5, hist:[{d:5,t:-99}],
  pressT:{L:-99,H:-99,B:-99}, relT:{L:-99,H:-99,B:-99},
  dashEvent:0, motionOk:null, blockHeld:false, downHeld:false, intentT:0,
  poll(){},
  held(n){ return n==='B'?this.blockHeld:(n==='down'?this.downHeld:false); },
  pressedNow(b){ return this.pressT[b]===tickCount; },
  releasedNow(){ return false; },
  pressedWithin(b,n){ return tickCount-this.pressT[b]<=n; },
  matchMotion(m){ return this.motionOk===m; },
  tapped(){ return false; },
};
function aiPress(p,b){ p.pressT[b==='any'?'L':b]=tickCount; }
function aiThink(f,o){
  const p=f.pad;
  p.motionOk=null; p.dashEvent=0;
  if(GAME.phase==='finish'){
    if(f===GAME.winner){
      p.blockHeld=false; p.downHeld=false; p.dir=5;
      if(o.staggerT>40&&o.staggerT%38===0){
        const fin=f.def.finisher; p.motionOk=fin.seq; aiPress(p,fin.btn);
      }
    }
    return;
  }
  if(!['idle','walk','crouch','dash','land','air','block','run','runstop'].includes(f.state))return;
  const dx=Math.abs(o.x-f.x);
  if(f.airborne()){ if(dx<190&&grand()<0.2)aiPress(p,'H'); return; }
  // while running: stop at poking range, sometimes throw a running attack
  if(f.state==='run'){ if(dx<170)p.dir=5; else if(dx<320&&grand()<0.10)aiPress(p,'L'); return; }
  // reactive block (checked every tick, low probability so it's beatable)
  if(o.state==='attack'&&o.move&&o.move.hits&&dx<250&&grand()<0.12){
    p.blockHeld=true; p.downHeld=o.move.hits[0].guard==='low';
    p.dir=p.downHeld?2:5; p.intentT=tickCount+16; return;
  }
  if(tickCount<p.intentT)return;
  p.blockHeld=false; p.downHeld=false;
  const m=f.def.moves, r=grand();
  const sp=grand()<0.5?m.sp1:m.sp2;
  if(dx>300){
    if(r<0.26&&(m.sp1.spawn||(m.sp1.hits&&m.sp1.hits[0].fx>150))){ p.motionOk=m.sp1.input.motion; aiPress(p,m.sp1.input.btn); p.dir=5; p.intentT=tickCount+30; }
    else if(r<0.32){ p.dashEvent=1; p.dir=6; p.intentT=tickCount+12; }
    else if(r<0.40){ p.dir=9; p.intentT=tickCount+20; }
    else { p.dir=6; p.intentT=tickCount+14; }
  }else if(dx>150){
    if(r<0.10){ p.dir=9; p.intentT=tickCount+20; }
    else if(r<0.20){ aiPress(p,'H'); p.dir=6; p.intentT=tickCount+18; }
    else if(r<0.30){ p.motionOk=sp.input.motion; aiPress(p,sp.input.btn); p.dir=5; p.intentT=tickCount+26; }
    else if(r<0.75){ p.dir=6; p.intentT=tickCount+10; }
    else { p.dir=4; p.intentT=tickCount+10; }
  }else{
    if(f.meter>=100&&r<0.10){ p.motionOk='236236'; aiPress(p,'L'); p.intentT=tickCount+30; }
    else if(r<0.32){ aiPress(p,'L'); p.dir=5; p.intentT=tickCount+9; }
    else if(r<0.48){ aiPress(p,'H'); p.dir=5; p.intentT=tickCount+14; }
    else if(r<0.60){ p.downHeld=true; p.dir=2; aiPress(p,'H'); p.intentT=tickCount+16; }
    else if(r<0.72){ p.motionOk=sp.input.motion; aiPress(p,sp.input.btn); p.intentT=tickCount+24; }
    else if(r<0.82){ p.blockHeld=true; p.dir=5; p.intentT=tickCount+20; }
    else { p.dir=4; p.intentT=tickCount+12; }
  }
}

// extra test hooks
MB.startFight=(a,b)=>{ GAME.mode='2p'; GAME.selIds=[a,b]; initMatch(a,b); };
MB.start1p=(a,b)=>{ GAME.mode='1p'; GAME.selIds=[a,b]; initMatch(a,b); };
MB.AIPAD=AIPAD; MB.FINSCRIPTS=FINSCRIPTS; MB.ROSTER=ROSTER;
</script>
